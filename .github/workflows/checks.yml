name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.8.6
      - run: python -m compileall -q src scripts
      - run: ruff check src scripts --no-cache
      - run: |
          for file in src/gurumoji/static/*.js; do node --check "$file"; done

  # GitHub上ではまだ実行・確認していない。
  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: archive/development-assets-20261016
          path: development-assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 検証用の分離コピーを作成
        run: |
          root="$GITHUB_WORKSPACE/app/.verification"
          dev="$GITHUB_WORKSPACE/development-assets"
          app="$GITHUB_WORKSPACE/app"
          mkdir -p "$root"
          for dir in tests scripts docs config devtools notebooks; do
            if [ -d "$dev/$dir" ]; then rsync -a --exclude=node_modules --exclude=__pycache__ --exclude=.pytest_cache --exclude=.env --exclude=tokens.json --exclude='*.pyc' "$dev/$dir/" "$root/$dir/"; fi
          done
          find "$dev" -maxdepth 1 -type f ! -name .env -exec cp -t "$root" {} +
          rsync -a --exclude=__pycache__ --exclude='*.pyc' "$app/src/" "$root/src/"
          for dir in scripts docs config notebooks .github; do
            if [ -d "$app/$dir" ]; then rsync -a --exclude=__pycache__ --exclude=.env --exclude=tokens.json --exclude='*.pyc' "$app/$dir/" "$root/$dir/"; fi
          done
          find "$app" -maxdepth 1 -type f ! -name .env ! -name '*.lnk' -exec cp -t "$root" {} +
          cp "$dev/pytest.ini" "$root/pytest.ini"
      - name: 依存関係を導入
        working-directory: app/.verification
        run: |
          python -m pip install -r config/requirements-cloud-cpu.lock.txt -r config/requirements-dev.txt
          npm ci --prefix tests/dom
      - name: 試験を実行
        working-directory: app/.verification
        run: python scripts/run_tests.py
