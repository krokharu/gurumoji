    <g id="motion-plus-medium"><path id="plus-medium" d="M-19.0000,-36.0500 Q-19.0000,-50.0000 -5.0500,-50.0000 L5.0500,-50.0000 Q19.0000,-50.0000 19.0000,-36.0500 L19.0000,-32.9500 Q19.0000,-19.0000 32.9500,-19.0000 L36.0500,-19.0000 Q50.0000,-19.0000 50.0000,-5.0500 L50.0000,5.0500 Q50.0000,19.0000 36.0500,19.0000 L32.9500,19.0000 Q19.0000,19.0000 19.0000,32.9500 L19.0000,36.0500 Q19.0000,50.0000 5.0500,50.0000 L-5.0500,50.0000 Q-19.0000,50.0000 -19.0000,36.0500 L-19.0000,32.9500 Q-19.0000,19.0000 -32.9500,19.0000 L-36.0500,19.0000 Q-50.0000,19.0000 -50.0000,5.0500 L-50.0000,-5.0500 Q-50.0000,-19.0000 -36.0500,-19.0000 L-32.9500,-19.0000 Q-19.0000,-19.0000 -19.0000,-32.9500 Z" transform="translate(121 316) rotate(35)"/></g>
    <g id="motion-plus-small"><path id="plus-small" d="M-19.0000,-32.2000 Q-19.0000,-43.0000 -8.2000,-43.0000 L8.2000,-43.0000 Q19.0000,-43.0000 19.0000,-32.2000 L19.0000,-29.8000 Q19.0000,-19.0000 29.8000,-19.0000 L32.2000,-19.0000 Q43.0000,-19.0000 43.0000,-8.2000 L43.0000,8.2000 Q43.0000,19.0000 32.2000,19.0000 L29.8000,19.0000 Q19.0000,19.0000 19.0000,29.8000 L19.0000,32.2000 Q19.0000,43.0000 8.2000,43.0000 L-8.2000,43.0000 Q-19.0000,43.0000 -19.0000,32.2000 L-19.0000,29.8000 Q-19.0000,19.0000 -29.8000,19.0000 L-32.2000,19.0000 Q-43.0000,19.0000 -43.0000,8.2000 L-43.0000,-8.2000 Q-43.0000,-19.0000 -32.2000,-19.0000 L-29.8000,-19.0000 Q-19.0000,-19.0000 -19.0000,-29.8000 Z" transform="translate(72 408) rotate(8)"/></g>
  </g>
