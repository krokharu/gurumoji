<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1920" height="1080" viewBox="-120 -70 1912 1075" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">グルモジ</title>
  <desc id="logo-desc">6秒で繰り返すグルモジのロゴアニメーション。輪が描かれ、文字が現れ、プラス記号が弾む。文字、濁点、吹き出しを囲む輪、3つの黄色いプラス記号を個別に編集可能。背景は透明。</desc>
  <style><![CDATA[
    #orbit { stroke-dasharray:1; animation:gm-draw 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes gm-draw {0% {stroke-dashoffset:1;opacity:0} 2% {opacity:1} 32%,90% {stroke-dashoffset:0;opacity:1} 98%,100% {stroke-dashoffset:0;opacity:0}}

    #glyph-gu {transform-box:fill-box; transform-origin:center; animation:gm-gu 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-gu {
      0%,8.333% {opacity:0; transform:translateY(36px) scale(.96)}
      14.000% {opacity:1;transform:translateY(-4px) scale(1.015)}
      18.667% {opacity:1;transform:translateY(0px) scale(1)}
      21.333%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #glyph-ru {transform-box:fill-box; transform-origin:center; animation:gm-ru 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-ru {
      0%,11.333% {opacity:0; transform:translateY(36px) scale(.96)}
      17.000% {opacity:1;transform:translateY(-4px) scale(1.015)}
      21.667% {opacity:1;transform:translateY(0px) scale(1)}
      24.333%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #glyph-mo {transform-box:fill-box; transform-origin:center; animation:gm-mo 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-mo {
      0%,14.333% {opacity:0; transform:translateY(36px) scale(.96)}
      20.000% {opacity:1;transform:translateY(-4px) scale(1.015)}
      24.667% {opacity:1;transform:translateY(0px) scale(1)}
      27.333%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #ji-body {transform-box:fill-box; transform-origin:center; animation:gm-ji 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-ji {
      0%,17.333% {opacity:0; transform:translateY(36px) scale(.96)}
      23.000% {opacity:1;transform:translateY(-4px) scale(1.015)}
      27.667% {opacity:1;transform:translateY(0px) scale(1)}
      30.333%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #ji-dakuten {transform-box:fill-box; transform-origin:center; animation:gm-dakuten 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-dakuten {
      0%,22.333% {opacity:0; transform:translateY(22px) scale(.25) rotate(-24deg)}
      28.000% {opacity:1;transform:translateY(-7px) scale(1.13) rotate(7deg)}
      32.667% {opacity:1;transform:translateY(2px) scale(.96) rotate(-3deg)}
      35.333%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #motion-plus-small {transform-box:fill-box; transform-origin:center; animation:gm-plus-small 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-plus-small {
      0%,20.833% {opacity:0; transform:translateY(22px) scale(.25) rotate(-24deg)}
      26.500% {opacity:1;transform:translateY(-7px) scale(1.13) rotate(7deg)}
      31.167% {opacity:1;transform:translateY(2px) scale(.96) rotate(-3deg)}
      33.833%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #motion-plus-medium {transform-box:fill-box; transform-origin:center; animation:gm-plus-medium 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-plus-medium {
      0%,23.833% {opacity:0; transform:translateY(22px) scale(.25) rotate(-24deg)}
      29.500% {opacity:1;transform:translateY(-7px) scale(1.13) rotate(7deg)}
      34.167% {opacity:1;transform:translateY(2px) scale(.96) rotate(-3deg)}
      36.833%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }

    #motion-plus-large {transform-box:fill-box; transform-origin:center; animation:gm-plus-large 6s cubic-bezier(.22,.7,.3,1) infinite;}
    @keyframes gm-plus-large {
      0%,26.833% {opacity:0; transform:translateY(22px) scale(.25) rotate(-24deg)}
      32.500% {opacity:1;transform:translateY(-7px) scale(1.13) rotate(7deg)}
      37.167% {opacity:1;transform:translateY(2px) scale(.96) rotate(-3deg)}
      39.833%,90% {opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
      98%,100% {opacity:0;transform:translateY(-5px) scale(1) rotate(0deg)}
    }
]]></style>
