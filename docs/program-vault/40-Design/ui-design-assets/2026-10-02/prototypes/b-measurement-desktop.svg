<text x="527" y="870.4500000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">「欠測」は invalid_source_value の表示。詳細な原因は取得できる情報の範囲だけ示す。</text>
<text x="32" y="1199.4" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700">3  内容を確認して採用</text>
