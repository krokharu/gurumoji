<text x="32" y="161" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">A · 既存モード＋段階レビュー</text>
<rect x="32" y="184.1" width="180" height="42" rx="5" fill="#fffef9" stroke="#bac6bb" stroke-width="1.2"/>
