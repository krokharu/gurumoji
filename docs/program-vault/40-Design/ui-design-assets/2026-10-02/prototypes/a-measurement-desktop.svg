<text x="813" y="834.4500000000002" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">invalid_source_value</text>
<text x="420" y="870.4500000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">「欠測」は invalid_source_value の表示。詳細な原因は取得できる情報の範囲だけ示す。</text>
<text x="420" y="908.9000000000002" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700">3  内容を確認して採用</text>
<text x="420" y="932.9000000000002" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">□ 規則・個票・欠測・限界を確認した</text>
<text x="420" y="957.6500000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">確認は画面上の提案。サーバーに永続的なレビュー証跡があるとは扱わない。</text>
<rect x="420" y="987.1000000000003" width="224" height="44" rx="7" fill="#e9f2e6" stroke="#bac6bb" stroke-width="1.2"/>
<text x="432" y="1015.1000000000003" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">この内容を採用（確認後）</text>
<text x="420" y="1043.1000000000004" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">採用操作は全件実行を始めない。採用後は同じ内容の r2 を示し、実行内容の確認へ進む。</text>
<rect x="420" y="1074.2000000000003" width="808" height="78.09999999999991" rx="6" fill="#fff1df" stroke="#bac6bb" stroke-width="1.2"/>
<text x="434" y="1098.2000000000003" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">採用・実行の前提</text>
<text x="434" y="1121.2000000000003" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">定義・入力の変更で試行確認は無効。実行は受付時の定義snapshotを使うか、版不一致で安全停止する。</text>
<rect x="32" y="1197.4" width="1216" height="78.09999999999991" rx="6" fill="#e9f2e6" stroke="#bac6bb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="46" y="1221.4" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">実行能力の境界</text>
<text x="46" y="1244.4" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">この規則による基礎測定は外部送信なし。O01相談・Transformer・AI見解の個別実行とは別。モデルの一括起動をこの操作に含めない。</text>
<text x="32" y="1293.5" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="11" font-weight="400">図は操作仕様の比較用。実アプリ・動作保証・利用者テスト結果ではありません。</text></svg>