<text x="422" y="211.1" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400">手法別</text>
<rect x="32" y="246.1" width="1216" height="101.20000000000007" rx="6" fill="#e9f2e6" stroke="#bac6bb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="46" y="270.1" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">対象と表示版</text>
<text x="46" y="293.1" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">合成データ：相談会サンプル / 入力 rev12</text>
<text x="46" y="316.20000000000005" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">除外後の先頭4発話を試行。全5発話のうち除外1。</text>
<text x="32" y="362.30000000000007" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700">定義 → 少数で試す → 内容を確認して採用 → 全件実行の確認</text>
<rect x="32" y="399.4000000000001" width="348" height="682" rx="8" fill="#fffef9" stroke="#bac6bb" stroke-width="1.2"/>
<rect x="400" y="399.4000000000001" width="848" height="780" rx="8" fill="#fffef9" stroke="#bac6bb" stroke-width="1.2"/>
<text x="50" y="430.4000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700">1  定義の確認用要約</text>
<rect x="50" y="452.4000000000001" width="148.609375" height="26" rx="4" fill="#e9f2e6" stroke="#bac6bb" stroke-width="1.2"/>
<text x="59" y="470.4000000000001" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="700">研究者の定義 · 未採用</text>
<text x="50" y="498.4000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">定義名</text>
<text x="50" y="522.4000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">発話の長さ（秒）</text>
<text x="50" y="560.1500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">入力列 → 計算規則</text>
<text x="50" y="584.1500000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">duration → duration</text>
<text x="50" y="621.9000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">型 / 尺度 / 手法</text>
<text x="50" y="645.9000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">number / ratio / descriptive</text>
