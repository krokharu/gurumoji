<text x="50" y="769.4000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">speech_seconds</text>
<text x="50" y="807.1500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">定義ID / 版：版は読取専用</text>
<text x="50" y="831.1500000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">dur_review / draft r1</text>
<text x="50" y="868.9000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">説明：発話ごとの時刻から算出された長さを測る</text>
<text x="50" y="892.0000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">。内容の重要性・関与の強さは測らない。</text>
<rect x="50" y="921.1000000000001" width="312" height="101.20000000000005" rx="6" fill="#e9f2e6" stroke="#bac6bb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="64" y="945.1000000000001" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">既採用版を保護する提案</text>
<text x="64" y="968.1000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">dur_base r2 は保持。変更は別の draft ID へ</text>
<text x="64" y="991.2000000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">。取消時も旧版に逆PUTしない。</text>
<text x="50" y="1049.4" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">編集へ戻る → 試行は再確認</text>
<text x="420" y="430.4000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700">2  試行を確かめる</text>
<text x="420" y="454.4000000000001" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">4発話 · 有効3 · 欠測1 · 除外1は試行外</text>
<text x="420" y="479.1500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">有効3発話の平均 20.7秒。0秒を含み、欠測を0に置換しない。</text>
<rect x="420" y="512.2500000000001" width="808" height="101.20000000000005" rx="6" fill="#fff1df" stroke="#bac6bb" stroke-width="1.2"/>
<text x="434" y="536.2500000000001" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">個票はAPI拡張後の提案</text>
<text x="434" y="559.2500000000001" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">現行trial応答には個票ID・欠測理由・定義revisionがない。下の時刻も試行snapshotからの解決が必要。現在データへ結合</text>
<text x="434" y="582.3500000000001" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">しない。</text>
