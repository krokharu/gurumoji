<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1324" viewBox="0 0 1280 1324" role="img" aria-labelledby="title desc"><title id="title">A案 測定定義・試行・採用 desktop</title><desc id="desc">低忠実度・非機能の提案。合成のduration測定を、定義、4発話の試行、明示採用、別の全件実行確認へ進める。0と欠測を分離し、個票APIと定義固定の前提を注記する。</desc><rect width="1280" height="1324" fill="#f4f5f0"/><rect x="0" y="0" width="1280" height="38" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
<text x="32" y="25" fill="#fffef9" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="700">提案モックアップ / 非機能 / 合成データ</text>
<text x="32" y="73" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700">Gurumoji</text>
<text x="1165" y="71" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">A案 · 1280px</text>
<text x="260" y="72" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400">文字起こし     結果一覧     分析・可視化     話者管理</text>
