<text x="813" y="740.4500000000002" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">有効</text>
<rect x="420" y="758.4500000000002" width="808" height="47" rx="0" fill="#fffef9" stroke="#bac6bb" stroke-width="1.2"/>
