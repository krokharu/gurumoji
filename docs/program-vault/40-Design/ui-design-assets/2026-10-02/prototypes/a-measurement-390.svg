<text x="16" y="2480.199999999999" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="11" font-weight="400">図は操作仕様の比較用。実アプリ・動作保証・利用者テスト結果ではあ</text>
<text x="16" y="2498.349999999999" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="11" font-weight="400">りません。</text></svg>