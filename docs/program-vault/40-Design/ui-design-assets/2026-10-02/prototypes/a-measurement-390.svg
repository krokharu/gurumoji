<text x="30" y="329.20000000000005" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">除外後の先頭4発話を試行。全5発話のうち除外1。</text>
<text x="16" y="375.30000000000007" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700">定義 → 少数で試す → 内容を確認して採用 → 全件実行の</text>
<text x="16" y="398.4000000000001" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700">確認</text>
