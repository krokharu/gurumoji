<text x="30" y="482.5000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">同時に全段階を開かない。以下は定義→試行→採用</text>
<text x="30" y="505.60000000000014" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">の状態を縦に並べたストーリーボード。</text>
