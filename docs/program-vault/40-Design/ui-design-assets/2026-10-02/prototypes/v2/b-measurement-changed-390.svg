<svg xmlns="http://www.w3.org/2000/svg" width="390" height="929" viewBox="0 0 390 929" role="img" aria-labelledby="title desc"><title id="title">B案 補助状態：定義変更後 390px</title><desc id="desc">非機能の提案。定義を秒から文字数へ変更した後。前の秒数試行は採用に使えず、再試行するまで採用は無効。</desc><rect width="390" height="929" fill="#f4f5f0"/><rect x="0" y="0" width="390" height="35" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
<text x="16" y="23" fill="#fffef9" font-family="Noto Sans CJK JP, sans-serif" font-size="12" font-weight="700">提案モックアップ / 非機能 / 合成データ</text>
<text x="16" y="72" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700">Gurumoji</text>
<text x="16" y="106" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">文字起こし　 結果一覧　 分析　 話者</text>
