<text x="30" y="461.1" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">前の試行は秒数の結果です。この定義の採用には使</text>
<text x="30" y="484.20000000000005" fill="#794415" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">えません。</text>
