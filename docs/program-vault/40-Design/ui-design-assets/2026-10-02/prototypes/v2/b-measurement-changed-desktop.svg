<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856" role="img" aria-labelledby="title desc"><title id="title">B案 補助状態：定義変更後 desktop</title><desc id="desc">非機能の提案。定義を秒から文字数へ変更した後。前の秒数試行は採用に使えず、再試行するまで採用は無効。</desc><rect width="1280" height="856" fill="#f4f5f0"/><rect x="0" y="0" width="1280" height="35" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
