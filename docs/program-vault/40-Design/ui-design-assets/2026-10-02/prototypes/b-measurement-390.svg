<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2675" viewBox="0 0 390 2675" role="img" aria-labelledby="title desc"><title id="title">B案 測定定義・試行・採用 390px</title><desc id="desc">低忠実度・非機能の提案。合成のduration測定を、定義、4発話の試行、明示採用、別の全件実行確認へ進める。0と欠測を分離し、個票APIと定義固定の前提を注記する。</desc><rect width="390" height="2675" fill="#f4f5f0"/><rect x="0" y="0" width="390" height="38" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
