<text x="66" y="892.2000000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">根拠paneは常設しない。閉じると結果の読み幅を戻す。新しい根拠を選ぶまで</text>
<text x="66" y="915.3000000000002" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">選択を維持。</text>
<text x="640" y="437.4000000000001" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700">根拠 E-002</text>
<text x="640" y="462.4000000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="13" font-weight="400">固定 run R-demo-07 / 入力 rev12</text>
<text x="640" y="483.8500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">発話 S002 / 話者B / 01:00–01:02</text>
