<text x="46" y="270.1" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">対象と表示版</text>
<text x="46" y="293.1" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">合成データ：相談会サンプル / 固定 run R-demo-07</text>
<text x="46" y="316.20000000000005" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">生成時 rev12 / 現在 rev13：更新あり。旧結果はそのまま表示。</text>
<text x="32" y="362.30000000000007" fill="#1c6b50" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700">desktopは必要時だけ2面。390pxは根拠を全幅で開き、戻り先を保持する。</text>
