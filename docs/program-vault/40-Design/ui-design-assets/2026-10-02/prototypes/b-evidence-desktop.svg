<text x="640" y="566.95" fill="#18211d" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700">「待つ時間が長いと感じます」</text>
<text x="640" y="609.6500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">前 S001：利用した場面を教えてください。</text>
<text x="640" y="632.7500000000001" fill="#53625a" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400">後 S003：場所によって違うかもしれません。</text>
