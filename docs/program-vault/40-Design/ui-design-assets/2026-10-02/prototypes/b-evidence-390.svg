<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1530" viewBox="0 0 390 1530" role="img" aria-labelledby="title desc"><title id="title">B案 結果と根拠 390px</title><desc id="desc">低忠実度・非機能の提案。AI下書き、原資料、研究者メモを分け、固定runの生成時引用と現在版の相違を表示。音声へ誤接続せず同じ結果の位置とfocusへ戻る。</desc><rect width="390" height="1530" fill="#f4f5f0"/><rect x="0" y="0" width="390" height="38" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
