<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1464" viewBox="0 0 1280 1464" role="img" aria-labelledby="title desc"><title id="title">A案 結果と根拠 desktop</title><desc id="desc">低忠実度・非機能の提案。AI下書き、原資料、研究者メモを分け、固定runの生成時引用と現在版の相違を表示。音声へ誤接続せず同じ結果の位置とfocusへ戻る。</desc><rect width="1280" height="1464" fill="#f4f5f0"/><rect x="0" y="0" width="1280" height="38" rx="0" fill="#1c6b50" stroke="#1c6b50" stroke-width="1.2"/>
