<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>グルモジ｜分析ワークスペース UI設計案</title>
<style>
:root{--ink:#183b44;--muted:#536b72;--line:#d6e2e4;--paper:#fff;--bg:#f3f7f7;--accent:#12695e;--pale:#e5f3ef;--warn:#80501c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;font-size:14px;line-height:1.7}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d08725;outline-offset:3px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:.025em}h2{font-size:22px}h3{font-size:16px}button{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:8px 13px}.primary{background:var(--accent);border-color:var(--accent);color:white}.quiet{background:transparent}.prototype{padding:10px 24px;background:#e7edf7;color:#314963;font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.prototype strong{margin-right:12px}.app{max-width:1500px;margin:auto;padding:26px 28px 48px}.brand{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--accent);margin-bottom:10px}.header{display:flex;align-items:center;justify-content:space-between;gap:24px}.context{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:13px 0 22px;color:var(--muted);font-size:13px}.pill{display:inline-block;background:#e9eff1;border-radius:5px;padding:2px 8px;font-size:12px}.pill.good{background:var(--pale);color:#175c4d}.pill.warn{background:#fcf0dc;color:var(--warn)}.mainnav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap}.mainnav button{background:transparent;border-color:transparent;min-width:125px;font-weight:700}.mainnav button[aria-current=page]{background:var(--ink);color:white}.page-intro{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;align-items:center}.muted{color:var(--muted);font-size:13px}.mobile-result-nav{display:none}.work{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}.catalog,.surface{border:1px solid var(--line);border-radius:14px;background:white}.catalog{padding:18px}.surface{padding:24px;min-width:0}.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin:5px 0 12px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filters button{font-size:12px;padding:4px 9px}.filters button[aria-pressed=true]{background:var(--pale);border-color:#82b5a9;color:#125e4c}.list-count{font-size:12px;color:var(--muted);margin:10px 0}.result-button{display:block;width:100%;text-align:left;border-radius:9px;margin:7px 0;padding:12px;background:#fafcfc}.result-button[aria-current=true]{background:var(--pale);border-color:#5e9b8f;box-shadow:inset 3px 0 var(--accent)}.result-button strong,.result-button small{display:block}.result-button small{font-size:11px;color:var(--muted);margin-top:4px}.result-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.kind{font-size:11px;color:var(--accent);letter-spacing:.09em;font-weight:700;margin-bottom:4px}.metadata{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.note{background:#f8f4eb;color:#6d522c;border-left:3px solid #c5a469;padding:10px 13px;font-size:12px;margin:14px 0}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:9px}.metric strong{display:block;font-size:23px}.metric small{color:var(--muted)}.table-wrap{overflow:auto;max-width:100%;margin:15px 0}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}caption{text-align:left;color:var(--muted);font-size:12px;margin:0 0 9px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f0f5f5;font-weight:600;white-space:nowrap}td button{font-size:12px;padding:3px 8px}details{border-top:1px solid var(--line);padding-top:14px;margin-top:20px}summary{cursor:pointer;font-weight:700}details p,details dl{margin-top:10px}.claim{border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}.claim p{margin:8px 0 12px}.claim small{color:var(--muted)}.viz{background:#f5f9f9;border:1px solid var(--line);border-radius:10px;overflow:auto;margin:15px 0}.viz svg{display:block;width:100%;min-width:300px;height:auto}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.two .surface{padding:18px}label{display:block;font-size:13px;font-weight:600}select{max-width:100%;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);margin:6px 0 14px}.comparison-status{margin:0 0 16px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--pale)}.comparison-status.warn{background:#fcf0dc}.plan-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:20px}.step{position:relative;margin:14px 0;border:1px solid var(--line);border-radius:11px;padding:17px 18px 17px 55px}.step .number{position:absolute;top:17px;left:17px;border-radius:50%;background:var(--pale);color:var(--accent);width:26px;height:26px;text-align:center}.step p{font-size:13px;color:var(--muted);margin-top:6px}.toggle{display:flex;align-items:center;gap:10px;margin:14px 0}.toggle input{width:18px;height:18px;accent-color:var(--accent)}.discussion{border-left:3px solid #b3a6ce;padding-left:13px;margin:14px 0;font-size:13px}.discussion strong{display:block}.data-types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.data-types button[aria-pressed=true]{background:var(--ink);color:white}.data-info{padding:15px;background:#f1f7fb;border-radius:9px;margin:15px 0}.evidence{border:1px solid var(--line);border-radius:14px;width:min(460px,calc(100vw - 24px));max-height:90vh;padding:26px;color:var(--ink);margin:5vh 20px 5vh auto;box-shadow:0 16px 90px #152f4440}.evidence::backdrop{background:#152f4433}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}.quote{border-left:3px solid var(--accent);padding:15px;background:var(--pale);margin:18px 0}.context-line{font-size:13px;color:var(--muted);margin:14px 0}footer{font-size:12px;color:var(--muted);margin-top:24px}.empty{padding:28px 12px;text-align:center;color:var(--muted)}#announce{font-size:13px;color:var(--accent);min-height:25px;margin-top:10px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:1050px){.work{grid-template-columns:240px minmax(0,1fr)}.plan-layout{grid-template-columns:1fr}.app{padding:20px}.two{grid-template-columns:1fr}}@media(max-width:700px){.mobile-result-nav{display:flex;gap:8px;margin-bottom:14px}.mobile-result-nav button[aria-pressed=true]{background:var(--pale);border-color:var(--accent)}.work[data-mobile-pane=detail] .catalog{display:none}.work[data-mobile-pane=list] #result-detail{display:none}.app{padding:18px 12px}.prototype{padding:10px 12px}.header{align-items:flex-start;gap:10px}h1{font-size:21px}h2{font-size:19px}.header .muted{display:none}.mainnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.mainnav button{min-width:0;font-size:13px;padding:9px 5px}.work{display:block}.catalog{margin-bottom:15px}.catalog .result-list{max-height:250px;overflow:auto}.surface{padding:17px}.result-heading{display:block}.summary-grid{gap:5px}.metric{padding:9px}.metric strong{font-size:19px}.tools button{font-size:12px}.page-intro{display:block}.evidence{margin:4vh auto}.data-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="prototype"><span><strong>UI設計案 / 操作見本</strong>すべて架空データです。AI・保存・外部通信は実行しません。</span><a href="core-handler-routing-reorganization-plan.md">設計の詳細を読む</a></div>
<main class="app">
<div class="brand">GURUMOJI / ANALYSIS WORKSPACE</div>
<header class="header"><div><h1>分析・可視化</h1><p class="muted">結果を探す。根拠を読む。次の分析につなぐ。</p></div><span class="pill good">処理中の分析なし</span></header>
<div class="context"><strong>地域交通についての座談会 A</strong><span>本文 3版</span><span>範囲：議題1「移動の課題」</span><span>4発話・2名（架空）</span></div>
<nav class="mainnav" aria-label="分析の作業"><button data-nav="results" aria-current="page">結果を見る</button><button data-nav="compare">比較する</button><button data-nav="plan">分析を組む</button><button data-nav="data">データ・出力</button></nav>
<div id="main-view"></div><p id="announce" role="status" aria-live="polite"></p>
<footer>設計モック：検索・形式切替・根拠表示・比較・計画への引渡し・データ区分を操作できます。実アプリへの組込みは未実装です。<br><a href="analysis-flow-diagrams.html">分析全体の設計図へ</a> · 2026-09-20</footer>
</main>
<dialog id="evidence" class="evidence" aria-labelledby="evidence-title"><div class="dialog-head"><h2 id="evidence-title">根拠の発話</h2><button id="close-evidence" aria-label="根拠を閉じて結果へ戻る">閉じる</button></div><div id="evidence-body"></div></dialog>
<script>
'use strict';
const types={all:'すべて',table:'表・分類',claims:'主張',graph:'関係',sequence:'時系列',embedding:'クラスタ'};
const utterances=[
 {id:'u01',who:'参加者A',time:'00:12',text:'夕方の便が増えるなら、バスを使いたいです。',llm:'条件付き',jev:'条件付き'},
 {id:'u02',who:'参加者B',time:'00:26',text:'毎日の通勤にはバスを使う案に賛成です。',llm:'賛成',jev:'賛成'},
 {id:'u03',who:'参加者A',time:'00:41',text:'駅まで歩く距離が長いので、その案には反対です。',llm:'反対',jev:'反対'},
 {id:'u04',who:'参加者B',time:'00:58',text:'もう少し具体的な時刻表を見て考えたいです。',llm:'不明確',jev:'条件付き'}
];
const results=[
 {id:'r01',type:'table',title:'利用意向の立場分類',method:'LLM・ローカル',run:'実行 014',desc:'4発話を定義済みの立場で分類',contract:'stance-v1',field:'llm'},
 {id:'r02',type:'claims',title:'交通手段を選ぶ条件',method:'LLM・ローカル',run:'実行 015',desc:'2つの主張と元発話の根拠'},
 {id:'r03',type:'graph',title:'主張どうしの関連',method:'LLM → 関係集計',run:'実行 016',desc:'3つの論点・2つの関係'},
 {id:'r04',type:'sequence',title:'発話と論点の時間推移',method:'会話構造・ローカル',run:'実行 017',desc:'議題1の時刻・発話順'},
 {id:'r05',type:'embedding',title:'意味が近い発話のまとまり',method:'Transformer・ローカル',run:'実行 018',desc:'4発話の配置例・2群'},
 {id:'r06',type:'table',title:'利用意向の立場分類',method:'Jev・クラウド',run:'実行 019',desc:'同じ4発話・同じ立場の定義',contract:'stance-v1',field:'jev'}
];
const state={view:'results',selected:'r02',type:'all',search:'',left:'r01',right:'r06',source:'r02',data:'raw',local:true,mobilePane:'detail'};
const main=document.getElementById('main-view');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const find=id=>results.find(r=>r.id===id)||results[0];
function notify(text){document.getElementById('announce').textContent=text;}
function route(view,id){location.hash=view+(id?'?result='+encodeURIComponent(id):'');}
function parseRoute(){const restoreResultFocus=document.activeElement?.hasAttribute('data-result');const [view,query]=location.hash.slice(1).split('?');state.view=['results','compare','plan','data'].includes(view)?view:'results';const id=new URLSearchParams(query||'').get('result');if(results.some(r=>r.id===id)){if(state.view==='plan')state.source=id;else if(state.view==='results'){state.selected=id;state.mobilePane='detail';const r=find(id);if((state.type!=='all'&&state.type!==r.type)||!(r.title+' '+r.method+' '+r.desc).toLowerCase().includes(state.search.toLowerCase())){state.type='all';state.search='';}}}render();if(restoreResultFocus&&state.view==='results'){if(innerWidth<=700)document.getElementById('result-detail')?.focus();else document.querySelector('[data-result][aria-current=true]')?.focus();}}
function meta(r){return `<div class="metadata"><span class="pill good">実行済み</span><span class="pill warn">妥当性未確認</span><span class="pill">${r.run}</span><span class="pill">本文 3版</span></div>`;}
function evidenceButton(id){return `<button data-evidence="${id}" aria-label="${id}の根拠を開く">${id} ↗</button>`;}
function table(r){return `<div class="table-wrap"><table><caption>発話単位・名義尺度 / ${r.method} / 定義 stance-v1</caption><thead><tr><th>根拠</th><th>話者</th><th>立場</th></tr></thead><tbody>${utterances.map(u=>`<tr><td>${evidenceButton(u.id)}</td><td>${u.who}</td><td>${u[r.field]}</td></tr>`).join('')}</tbody></table></div>`;}
function visualization(r){
 if(r.type==='table')return `<div class="summary-grid"><div class="metric"><strong>4</strong><small>対象発話</small></div><div class="metric"><strong>0</strong><small>欠測</small></div><div class="metric"><strong>名義</strong><small>立場の尺度</small></div></div>${table(r)}<p class="muted">「不明確」は分類値です。未実行・失敗による欠測とは区別します。</p>`;
 if(r.type==='claims')return `<article class="claim"><span class="pill">主張 01 / AIの候補</span><h3>運行時刻が、利用意向の条件になっている</h3><p>夕方の増便を条件とする発話と、時刻表を見て判断したい発話があります。</p>${evidenceButton('u01')} ${evidenceButton('u04')}<p><small>限界：この2発話から、全参加者の意向や実際の利用を断定しません。</small></p></article><article class="claim"><span class="pill">主張 02 / AIの候補</span><h3>停留所・駅への距離も検討が必要</h3><p>駅まで歩く距離を反対理由として挙げています。</p>${evidenceButton('u03')}<p><small>反例の確認：移動距離が短い場合の意見は、この範囲では未確認です。</small></p></article>`;
 if(r.type==='graph')return `<div class="viz"><svg viewBox="0 0 620 235" role="img" aria-label="利用意向と、時刻表・アクセスの関連を示す架空の関係図"><path d="M310 90L140 160M310 90L480 160" stroke="#73998e" stroke-width="3"/><rect x="225" y="30" width="170" height="60" rx="10" fill="#1e695e"/><text x="310" y="66" text-anchor="middle" fill="white">利用意向</text><rect x="55" y="160" width="170" height="50" rx="10" fill="#ddefe8"/><text x="140" y="191" text-anchor="middle" fill="#183b44">時刻表</text><rect x="395" y="160" width="170" height="50" rx="10" fill="#ddefe8"/><text x="480" y="191" text-anchor="middle" fill="#183b44">アクセス</text><text x="175" y="118" fill="#536b72">条件として言及</text><text x="397" y="118" fill="#536b72">理由として言及</text></svg></div><div class="table-wrap"><table><caption>図と同じ内容を関係表で確認</caption><thead><tr><th>関係</th><th>種類</th><th>根拠</th></tr></thead><tbody><tr><td>時刻表 → 利用意向</td><td>条件として言及</td><td>${evidenceButton('u01')}</td></tr><tr><td>アクセス → 利用意向</td><td>理由として言及</td><td>${evidenceButton('u03')}</td></tr></tbody></table></div><p class="muted">関係の向きは理由・条件の参照です。因果効果を示す図ではありません。</p>`;
 if(r.type==='sequence')return `<div class="table-wrap"><table><caption>時間順で表示 / 議題1 / 1会話</caption><thead><tr><th>時刻</th><th>話者</th><th>発話</th><th>根拠</th></tr></thead><tbody>${utterances.map(u=>`<tr><td>${u.time}</td><td>${u.who}</td><td>${u.text}</td><td>${evidenceButton(u.id)}</td></tr>`).join('')}</tbody></table></div><p class="muted">この見本には音声を含みません。実装時は時間区間とプレイヤーを連動させます。</p>`;
 return `<div class="viz"><svg viewBox="0 0 600 270" role="img" aria-label="4発話の架空の2次元配置。u01とu04、u02とu03を別の群として表示"><path d="M55 25V235H565" fill="none" stroke="#b7caca"/><ellipse cx="185" cy="110" rx="97" ry="64" fill="#ddefe8"/><ellipse cx="405" cy="177" rx="98" ry="57" fill="#e8e4f4"/><g fill="#226c5e"><circle cx="152" cy="89" r="9"/><circle cx="216" cy="129" r="9"/></g><g fill="#78659f"><rect x="369" y="146" width="17" height="17"/><rect x="440" y="187" width="17" height="17"/></g><g fill="#183b44"><text x="168" y="87">u01</text><text x="233" y="125">u04</text><text x="393" y="149">u02</text><text x="463" y="191">u03</text></g></svg></div><p class="note">配置は画面見本用です。実際のモデル計算結果ではありません。</p><p>元発話を確認： ${utterances.map(u=>evidenceButton(u.id)).join(' ')}</p>`;
}
function detail(r){return `<div class="result-heading"><div><p class="kind">${types[r.type]} / ${r.method}</p><h2>${r.title}</h2></div><span class="pill">保存された結果</span></div>${meta(r)}<p class="muted">${r.desc}。範囲は議題1、本文3版に固定されています。</p><div class="tools"><button data-add-compare="${r.id}">比較へ追加</button><button class="primary" data-from="${r.id}">この結果から分析</button><button data-output="${r.id}">出力を見る</button></div>${visualization(r)}<details><summary>条件・履歴・次に使える分析</summary><p>入力：座談会 A / 本文3版 / u01〜u04。選択結果：${r.run}。</p><p>出所：${r.method}。結果形式：${types[r.type]}。この例の生成値は未検証です。</p><p>追加分析では元発話を再分析するか、この結果の値・主張を使うか選びます。元のRAWへ生成結果を書き戻しません。</p><p class="muted">モデル版・契約版・入力hashの詳細は実装時に保存済み記録から表示します。</p></details>`;}
function renderResults(){main.innerHTML=`<div class="page-intro"><div><h2>結果を探して、根拠まで読む</h2><p class="muted">形式や手法で絞り込み、選んだ結果だけを表示します。</p></div><button data-nav="plan">＋ 分析を追加</button></div><div class="mobile-result-nav" aria-label="結果の一覧と詳細"><button data-mobile-pane="list" aria-pressed="${state.mobilePane==='list'}">結果を探す（6件）</button><button data-mobile-pane="detail" aria-pressed="${state.mobilePane==='detail'}">選択した結果</button></div><div class="work" data-mobile-pane="${state.mobilePane}"><aside class="catalog" aria-label="結果を探す"><label for="result-search">結果名・手法を検索</label><input class="search" id="result-search" type="search" placeholder="例：立場、LLM、時間" value="${escape(state.search)}"><div class="filters" aria-label="結果形式">${Object.entries(types).map(([key,label])=>`<button data-filter="${key}" aria-pressed="${state.type===key}">${label}</button>`).join('')}</div><p class="list-count" id="result-count" aria-live="polite"></p><div class="result-list" id="result-list"></div></aside><section class="surface" id="result-detail" tabindex="-1" aria-label="選択した結果"></section></div>`;document.getElementById('result-search').addEventListener('input',e=>{state.search=e.target.value;updateResults();});updateResults();}
function updateResults(){const list=results.filter(r=>(state.type==='all'||r.type===state.type)&&(`${r.title} ${r.method} ${r.desc}`.toLowerCase().includes(state.search.toLowerCase())));document.getElementById('result-count').textContent=`${list.length}件表示 / 見本の全6件`;document.getElementById('result-list').innerHTML=list.map(r=>`<button class="result-button" data-result="${r.id}" aria-current="${r.id===state.selected}"><strong>${r.title}</strong><small>${types[r.type]} · ${r.method}</small><small>${r.run} / 実行済み・未検証</small></button>`).join('')||'<p class="empty">一致する結果がありません。検索や形式を変えてください。</p>';const selected=list.find(r=>r.id===state.selected)||list[0];if(selected){state.selected=selected.id;document.getElementById('result-detail').innerHTML=detail(selected);document.querySelectorAll('[data-result]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.result===state.selected)));}else document.getElementById('result-detail').innerHTML='<p class="empty">条件を変えると結果を表示できます。</p>';}
function compareSelect(side){return `<label for="compare-${side}">${side==='left'?'左':'右'}の結果</label><select id="compare-${side}" data-compare="${side}">${results.map(r=>`<option value="${r.id}" ${state[side]===r.id?'selected':''}>${r.title} / ${r.method}</option>`).join('')}</select>`;}
function renderCompare(){const a=find(state.left),b=find(state.right),same=a.id===b.id,compatible=!same&&a.type==='table'&&b.type==='table'&&a.contract===b.contract;main.innerHTML=`<div class="page-intro"><div><h2>条件を確かめて、2つの結果を比較</h2><p class="muted">ここでは同じ会話の実行結果を比較します。複数会話比較は実装時にこの入口へ接続します。</p></div></div><div class="comparison-status ${compatible?'':'warn'}" id="comparison-status">${compatible?'行対応が可能：同じ4発話・本文3版・同じ立場定義。異なる判定は1件です。':same?'同じ実行を選択しています。比較する別の結果を選んでください。':'並べて読む比較です。結果の型・意味が異なるため、数値の差分計算はできません。'}</div><div class="two">${[['left',a],['right',b]].map(([side,r])=>`<section class="surface">${compareSelect(side)}<h3>${r.title}</h3>${meta(r)}<p class="muted">対象4発話 / 議題1 / ${types[r.type]}</p>${visualization(r)}</section>`).join('')}</div>${compatible?`<section class="surface" style="margin-top:18px"><h3>異なる判定の根拠を読む</h3><p>u04：LLMは「不明確」、Jevは「条件付き」。多数決で正解にせず、文脈を確認します。</p>${evidenceButton('u04')}<p class="muted">型が同じでも測定の妥当性は未確認です。比較画面を開いただけでは検定を実行しません。</p></section>`:''}`;}
function renderPlan(){const source=find(state.source);const sourceCount=['claims','graph'].includes(source.type)?2:4;const sourceUnit=source.type==='claims'?'主張':source.type==='graph'?'関係':'行';main.innerHTML=`<div class="page-intro"><div><h2>この結果から、次の分析を組む</h2><p class="muted">目的・対象・結果の形式を先に定め、必要な段階だけ実行します。</p></div></div><div class="plan-layout"><section class="surface"><label for="plan-purpose">確かめたいこと</label><select id="plan-purpose"><option>条件や意見の違いを整理したい</option><option>分類した値の分布を見たい</option><option>意味の近い主張をまとめたい</option></select><div class="step"><span class="number">1</span><h3>入力を確認</h3><p>${source.title} / ${source.run} / ${types[source.type]}</p><label for="input-basis">次に分析するもの</label><select id="input-basis"><option>この結果の全件を分析する</option><option>根拠の元発話を再分析する</option></select><p>画面の表示件数ではなく、固定された結果とIDを使います。</p></div><div class="step"><span class="number">2</span><h3>手法と、返してほしい結果を決める</h3><p>LLM分析専用オーケストレーターが、手法・型・後続分析の担当と相談します。</p><p>型の案：根拠付き主張と関係表。必須項目：主張・支持／相違・根拠・未判定理由。</p><details><summary>相談の結論・異論を見る</summary><div class="discussion"><strong>手法担当</strong>立場と、立場の理由は別の項目にする。</div><div class="discussion"><strong>型担当</strong>主張IDと根拠発話IDを分け、関係の向きを記録する。</div><div class="discussion"><strong>後続分析担当</strong>関係集計へ渡すため、対象IDと関係種別を固定する。</div><p class="note">残る確認：理由の分類基準を研究者が確認。相談の合意だけでは採用しません。</p></details></div><div class="step"><span class="number">3</span><h3>試行してから、本実行</h3><p>少数例で根拠と型を確認 → 採用した型を固定 → 次の手法へ接続。</p><button id="show-pilot">試行結果の表示例を見る</button><div id="pilot-example" hidden><p class="note">表示例：構造検証は通過、手法上の確認が1件残っています。状態は「採用前」です。AIは実行していません。</p></div></div></section><aside class="surface"><h3>実行先と上限</h3><label class="toggle"><input type="checkbox" id="local-only" ${state.local?'checked':''}>ローカルだけで実行</label><p>計画・分析担当：ローカルLLM</p><p>追加の意味分析：ローカルTransformer</p><p class="note" id="jev-state">${state.local?'Jevは利用不可：クラウドを使う段階のためです。':'Jevは選択候補：クラウドでの選択肢判定。実行前に対象と送信先を確認します。'}</p><div class="summary-grid"><div class="metric"><strong>2回</strong><small>相談の修正上限</small></div><div class="metric"><strong id="plan-count">${sourceCount}${sourceUnit}</strong><small>入力の見本</small></div><div class="metric"><strong>不明</strong><small>使用量の見積り</small></div></div><p class="muted">モデル接続がない操作見本のため、使用量は見積もりません。</p><button disabled style="margin-top:15px">分析を開始（見本では実行不可）</button><p class="muted">実装時は進捗・取消・失敗段階の再試行をここに表示します。</p></aside></div>`;}
const dataInfo={raw:{title:'分析用RAW',text:'本文3版の元発話を固定した入力です。AIの分類や主張を本文に書き戻しません。',rows:[['本文snapshot','4発話','本文3版・議題1'],['対象・文脈の範囲','u01〜u04','対象集合の参照']]},derived:{title:'派生入力',text:'次の分析で使うために選択・変換した結果です。元の発話RAWとは区別します。',rows:[['選択した主張','2件','親：実行015'],['関係集計への入力','2関係','親：実行016']]},machine:{title:'機械用の分析結果',text:'追加分析が読む、精度と型を保った結果です。表示用の丸めや切り詰めを適用しません。',rows:[['立場の分類値','4行','実行014・定義stance-v1'],['根拠付き主張','2件','実行015'],['関係表','2行','実行016']]},presentation:{title:'閲覧・共有出力',text:'人が読むための表・図・レポートです。この区分のファイルを追加分析の入力には使いません。',rows:[['選択結果のレポート','表示用','元runを併記'],['比較表・グラフ','表示用','尺度・条件差を併記']]}};
function renderData(){const d=dataInfo[state.data];main.innerHTML=`<div class="page-intro"><div><h2>分析に使うデータと、共有する出力を分ける</h2><p class="muted">出所・本文版・親結果を確認して取り出します。</p></div></div><div class="data-types" aria-label="データの区分">${Object.entries(dataInfo).map(([key,val])=>`<button data-data="${key}" aria-pressed="${state.data===key}">${val.title}</button>`).join('')}</div><section class="surface"><h3>${d.title}</h3><p class="data-info">${d.text}</p><div class="table-wrap"><table><caption>データ区分の見本。実ファイルは作成していません。</caption><thead><tr><th>データ</th><th>単位・件数</th><th>由来</th></tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button disabled>ダウンロード（操作見本）</button><details><summary>保存・公開の状態を分ける</summary><p>結果の固定保存と、Vaultへの公開は別の状態です。公開だけの再試行ではAIを再実行しません。</p></details></section>`;}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});({results:renderResults,compare:renderCompare,plan:renderPlan,data:renderData}[state.view])();notify('');}
function openEvidence(id){const index=utterances.findIndex(u=>u.id===id),u=utterances[index];if(!u)return;document.getElementById('evidence-body').innerHTML=`<span class="pill">${u.id} / 本文3版</span><p class="context-line">${u.who} · ${u.time} · 議題1</p>${index>0?`<p class="context-line">前の発話：${utterances[index-1].text}</p>`:''}<blockquote class="quote">${u.text}</blockquote>${index<utterances.length-1?`<p class="context-line">次の発話：${utterances[index+1].text}</p>`:''}<p class="muted">原文は編集せず参照します。音声再生と文字起こし画面への移動は実装時に既存機能へ接続します。</p>`;document.getElementById('evidence').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mobilePane){state.mobilePane=b.dataset.mobilePane;document.querySelector('.work').dataset.mobilePane=state.mobilePane;document.querySelectorAll('[data-mobile-pane]').forEach(el=>{if(el.tagName==='BUTTON')el.setAttribute('aria-pressed',String(el.dataset.mobilePane===state.mobilePane));});return;}if(b.dataset.nav){route(b.dataset.nav);return;}if(b.dataset.filter){state.type=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));updateResults();return;}if(b.dataset.result){route('results',b.dataset.result);return;}if(b.dataset.evidence){openEvidence(b.dataset.evidence);return;}if(b.dataset.from){route('plan',b.dataset.from);return;}if(b.dataset.addCompare){state.left=b.dataset.addCompare;if(state.right===state.left)state.right=state.left==='r01'?'r06':'r01';route('compare');return;}if(b.dataset.output){state.data='presentation';route('data');return;}if(b.dataset.data){state.data=b.dataset.data;renderData();document.querySelector(`[data-data="${state.data}"]`).focus();return;}if(b.id==='close-evidence')document.getElementById('evidence').close();if(b.id==='show-pilot'){document.getElementById('pilot-example').hidden=false;notify('試行結果の表示例です。AIは実行していません。');}});
document.addEventListener('change',e=>{if(e.target.dataset.compare){const side=e.target.dataset.compare;state[side]=e.target.value;renderCompare();document.getElementById('compare-'+side).focus();}if(e.target.id==='input-basis'){const source=find(state.source);document.getElementById('plan-count').textContent=e.target.selectedIndex===1?'4発話':source.type==='claims'?'2主張':source.type==='graph'?'2関係':'4行';}if(e.target.id==='local-only'){state.local=e.target.checked;document.getElementById('jev-state').textContent=state.local?'Jevは利用不可：クラウドを使う段階のためです。':'Jevは選択候補：クラウドでの選択肢判定。実行前に対象と送信先を確認します。';}});
window.addEventListener('hashchange',parseRoute);parseRoute();
</script>
</body></html>
