<style>
:root { --bg:#f6faf7; --fg:#18241e; --muted:#56645c; --card:#fff; --line:#d2ddd7; --chip:#F4FAF6; }
body.dark { --bg:#10231b; --fg:#e6f4ea; --muted:#9db8a9; --card:#16302a; --line:#27473b; }
body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--fg); font:14px/1.6 "Noto Sans JP","Yu Gothic UI",sans-serif; }
main { max-width:1200px; margin:0 auto; }

label { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px; }
figure { margin:0; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--card); text-align:center; }

.chip img { width:100%; height:100%; object-fit:contain; }
.nochip .chip { background:transparent; }
figcaption { display:flex; flex-direction:column; gap:2px; margin-top:6px; font-size:.78rem; }
figcaption code { color:var(--muted); font-size:.68rem; } figcaption small { color:var(--muted); } figcaption em { color:#00714C; font-style:normal; font-weight:700; }
